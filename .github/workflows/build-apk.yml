name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, beta-0.3, beta-0.3.6, beta-0.3.7 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true; $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'
      - name: Keep debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tokenmonitor-debug-keystore-v1
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TokenMonitorJean-Beta-0.3.7-Refresh-2s
          path: app/build/outputs/apk/debug/app-debug.apk
