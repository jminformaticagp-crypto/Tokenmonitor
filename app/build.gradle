plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jean.tokenmonitor'
    compileSdk 36

    defaultConfig {
        applicationId 'com.jean.tokenmonitor'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '0.2.4-wallet-fix'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.web3j:core:4.12.3-android'
    implementation 'org.web3j:crypto:4.12.3-android'
    implementation 'org.web3j:utils:4.12.3-android'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
}
